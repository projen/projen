name: pull-request-lint
on:
  pull_request_target:
    types:
      - labeled
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited
  merge_group: {}
jobs:
  validate:
    name: Validate PR title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    if: (github.event_name == 'pull_request' || github.event_name == 'pull_request_target')
    steps:
      - id: validate-pr-title
        uses: amannn/action-semantic-pull-request@v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |-
            feat
            fix
            chore
          requireScope: false
  contributorStatement:
    name: Require Contributor Statement
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    env:
      PR_BODY: ${{ github.event.pull_request.body }}
      EXPECTED: By submitting this pull request, I confirm that my contribution is made under the terms of the Apache 2.0 license.
      HELP: Contributor statement missing from PR description. Please include the following text in the PR description
    if: (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && !(github.event.pull_request.user.login == 'projen-automation' || github.event.pull_request.user.login == 'dependabot[bot]')
    steps:
      - id: auto_b0c7520c
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |-
            const actual = process.env.PR_BODY.replace(/\r?\n/g, "\n");
            const expected = process.env.EXPECTED.replace(/\r?\n/g, "\n");
            if (!actual.includes(expected)) {
                console.log("%j", actual);
                console.log("%j", expected);
                core.setFailed(`${process.env.HELP}: ${expected}`);
            }
  pull-request-lint:
    needs:
      - validate
      - contributorStatement
    runs-on: ubuntu-latest
    permissions: {}
    if: always()
    steps:
      - name: validate result
        id: validate_result
        run: echo ${{ needs.validate.result }}
      - name: contributorStatement result
        id: contributorstatement_result
        run: echo ${{ needs.contributorStatement.result }}
      - name: Set status based on pull request checks
        id: set_status_based_on_pull_request_checks
        if: ${{ (needs.validate.result != 'success' && needs.validate.result != 'skipped') || (needs.contributorStatement.result != 'success' && needs.contributorStatement.result != 'skipped') }}
        run: exit 1
